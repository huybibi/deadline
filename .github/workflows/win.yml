name: build-win

# Bản Windows (.exe portable) dựng trên runner Windows của GitHub rồi đưa lên release v0.2.0.
# Dựng song song với build-mac (mac.yml) để cả 3 file nằm chung một release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài phụ thuộc
        run: npm ci || npm install

      - name: Test đơn vị
        run: npm test

      - name: Dựng portable .exe
        run: npx electron-builder --win portable -p never

      - name: Danh sách file sau khi dựng
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: deadline-win
          path: dist/*.exe

      - name: Đưa lên release v0.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.2.0
        shell: bash
        # release có thể chưa tồn tại (lần đầu đẩy tag) → tạo trước rồi mới upload
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "deadline $TAG" --notes "Bản dựng cho tag $TAG."
          gh release upload "$TAG" dist/*.exe --clobber
